<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CUBEXA AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Marked.js for Markdown Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify for XSS Protection -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <style>
    .streaming-cursor::after {
      content: '▋';
      display: inline-block;
      animation: blink 1s infinite;
      margin-left: 2px;
      color: #6366f1;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-full md:w-64 bg-gray-100 dark:bg-gray-800/80 border-b md:border-b-0 md:border-r border-gray-200 dark:border-gray-700 flex flex-col flex-shrink-0 z-20">
    <div class="p-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-700">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
          C
        </div>
        <span class="font-extrabold text-xl tracking-wide text-indigo-600 dark:text-indigo-400">CUBEXA</span>
      </div>
      <button id="newChatBtn" class="p-2 text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" title="New Chat">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
    </div>

    <!-- Saved Chat History List -->
    <div id="chatHistoryList" class="flex-1 overflow-y-auto p-3 space-y-1"></div>

    <!-- Sidebar Footer -->
    <div class="p-3 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
      <button id="themeToggle" class="p-2 text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-white rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition" title="Toggle Theme">
        <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>
      <button id="settingsBtn" class="flex items-center space-x-2 px-3 py-1.5 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span>Settings</span>
      </button>
    </div>
  </aside>

  <!-- Main Interface -->
  <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-white dark:bg-gray-900">
    <!-- Top Header -->
    <header class="h-14 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4">
      <div class="flex items-center space-x-3">
        <h1 class="font-bold text-gray-800 dark:text-gray-100">CUBEXA AI</h1>
        <span id="modelBadge" class="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 px-2.5 py-0.5 rounded-full font-mono">gpt-4o</span>
      </div>
      <button id="clearChatBtn" class="text-xs text-gray-500 hover:text-red-500 dark:text-gray-400 dark:hover:text-red-400 transition">Clear Chat</button>
    </header>

    <!-- Chat Viewport -->
    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
      <div id="welcomeMessage" class="h-full flex flex-col items-center justify-center text-center p-6 text-gray-500 dark:text-gray-400">
        <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-3xl font-black mb-4 shadow-xl">
          C
        </div>
        <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-2">Welcome to CUBEXA</h2>
        <p class="max-w-md text-sm">How can I assist you today? Feel free to ask questions, attach photos, or upload files.</p>
      </div>
    </div>

    <!-- Attachment Thumbnail Previews -->
    <div id="attachmentPreviews" class="hidden px-4 py-2 border-t border-gray-100 dark:border-gray-800 flex gap-3 overflow-x-auto bg-gray-50 dark:bg-gray-800/40"></div>

    <!-- Chat Form / Input -->
    <div class="p-3 md:p-4 border-t border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900">
      <form id="chatForm" class="flex items-end gap-2 max-w-4xl mx-auto relative">
        
        <!-- Hidden File Input -->
        <input type="file" id="fileInput" class="hidden" accept="image/*, .txt, .json, .md, .js, .py, .csv" multiple>

        <!-- '+' Attachment Button -->
        <button type="button" id="attachBtn" class="p-3 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-xl transition flex-shrink-0 focus:outline-none" title="Attach photos or files">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
        </button>

        <!-- Textarea -->
        <textarea id="chatInput" rows="1" class="flex-1 resize-none bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-xl p-3 max-h-36 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm md:text-base" placeholder="Message CUBEXA..."></textarea>

        <!-- Send Button -->
        <button type="submit" id="sendBtn" class="p-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition flex-shrink-0 disabled:opacity-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </form>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-gray-200 dark:border-gray-700">
      <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-3">
        <h3 class="font-bold text-lg text-gray-800 dark:text-gray-100">CUBEXA Settings</h3>
        <button id="closeSettingsBtn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl font-bold">&times;</button>
      </div>
      
      <div class="space-y-3 text-sm">
        <div>
          <label class="block font-medium mb-1">API Base Endpoint</label>
          <input type="text" id="apiEndpointInput" class="w-full p-2.5 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="https://api.openai.com/v1">
        </div>
        <div>
          <label class="block font-medium mb-1">API Key</label>
          <input type="password" id="apiKeyInput" class="w-full p-2.5 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="sk-...">
        </div>
        <div>
          <label class="block font-medium mb-1">Model ID</label>
          <input type="text" id="modelInput" class="w-full p-2.5 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="gpt-4o">
        </div>
        <div>
          <label class="block font-medium mb-1">System Prompt</label>
          <textarea id="systemPromptInput" rows="3" class="w-full p-2.5 rounded-lg border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="You are CUBEXA..."></textarea>
        </div>
      </div>

      <div class="pt-2 flex justify-end">
        <button id="saveSettingsBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition text-sm">Save Configuration</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Configuration & State
    const DEFAULT_CONFIG = {
      apiEndpoint: 'https://api.openai.com/v1',
      apiKey: '',
      model: 'gpt-4o',
      systemPrompt: 'You are CUBEXA, a highly capable, intelligent, and friendly AI assistant.'
    };

    let config = JSON.parse(localStorage.getItem('cubexa_config')) || { ...DEFAULT_CONFIG };
    let messages = JSON.parse(localStorage.getItem('cubexa_messages')) || [];
    let currentAttachments = [];

    // DOM Elements
    const messagesContainer = document.getElementById('messagesContainer');
    const welcomeMessage = document.getElementById('welcomeMessage');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const attachmentPreviews = document.getElementById('attachmentPreviews');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const themeToggle = document.getElementById('themeToggle');
    const modelBadge = document.getElementById('modelBadge');

    // Settings Inputs
    const apiEndpointInput = document.getElementById('apiEndpointInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelInput = document.getElementById('modelInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    // Initialize UI
    function init() {
      modelBadge.textContent = config.model || 'gpt-4o';
      renderMessages();

      // Textarea Auto-resize
      chatInput.addEventListener('input', () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = chatInput.scrollHeight + 'px';
      });
    }

    // Attachment '+' Handler
    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      for (const file of files) {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const base64 = evt.target.result;
            currentAttachments.push({ type: 'image', data: base64, name: file.name });
            renderAttachmentPreviews();
          };
          reader.readAsDataURL(file);
        } else {
          // Plain Text files
          const reader = new FileReader();
          reader.onload = (evt) => {
            const textContent = evt.target.result;
            currentAttachments.push({ type: 'file', data: textContent, name: file.name });
            renderAttachmentPreviews();
          };
          reader.readAsText(file);
        }
      }
      fileInput.value = '';
    });

    function renderAttachmentPreviews() {
      if (currentAttachments.length === 0) {
        attachmentPreviews.classList.add('hidden');
        attachmentPreviews.innerHTML = '';
        return;
      }
      attachmentPreviews.classList.remove('hidden');
      attachmentPreviews.innerHTML = currentAttachments.map((att, index) => `
        <div class="relative group flex-shrink-0">
          ${att.type === 'image' 
            ? `<img src="${att.data}" class="h-16 w-16 object-cover rounded-lg border border-gray-300 dark:border-gray-600">`
            : `<div class="h-16 w-16 bg-gray-200 dark:bg-gray-700 rounded-lg flex flex-col items-center justify-center p-1 text-center border border-gray-300 dark:border-gray-600">
                <span class="text-xs font-bold truncate w-full">${att.name}</span>
               </div>`
          }
          <button type="button" onclick="removeAttachment(${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs hover:bg-red-600 shadow">×</button>
        </div>
      `).join('');
    }

    window.removeAttachment = function(index) {
      currentAttachments.splice(index, 1);
      renderAttachmentPreviews();
    };

    // Render Messages
    function renderMessages() {
      if (messages.length === 0) {
        welcomeMessage.classList.remove('hidden');
        messagesContainer.innerHTML = '';
        messagesContainer.appendChild(welcomeMessage);
        return;
      }
      welcomeMessage.classList.add('hidden');
      messagesContainer.innerHTML = '';

      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;
        
        let contentHtml = '';
        if (typeof msg.content === 'string') {
          contentHtml = DOMPurify.sanitize(marked.parse(msg.content));
        } else if (Array.isArray(msg.content)) {
          // Vision Payload
          msg.content.forEach(part => {
            if (part.type === 'text') contentHtml += DOMPurify.sanitize(marked.parse(part.text));
            if (part.type === 'image_url') contentHtml += `<img src="${part.image_url.url}" class="max-w-xs rounded-lg my-2 border border-gray-300 dark:border-gray-700">`;
          });
        }

        div.innerHTML = `
          <div class="max-w-[85%] md:max-w-[75%] rounded-2xl p-4 ${
            msg.role === 'user' 
              ? 'bg-indigo-600 text-white rounded-br-none' 
              : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-bl-none border border-gray-200 dark:border-gray-700'
          }">
            <div class="text-xs font-semibold mb-1 opacity-75">${msg.role === 'user' ? 'You' : 'CUBEXA'}</div>
            <div class="prose dark:prose-invert text-sm max-w-none break-words">${contentHtml}</div>
          </div>
        `;
        messagesContainer.appendChild(div);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Submit Message to API
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text && currentAttachments.length === 0) return;

      if (!config.apiKey) {
        alert('Please configure your API Key in Settings first!');
        openSettings();
        return;
      }

      // Format Message Payload
      let userContent;
      if (currentAttachments.length > 0) {
        userContent = [];
        if (text) userContent.push({ type: 'text', text: text });
        currentAttachments.forEach(att => {
          if (att.type === 'image') {
            userContent.push({ type: 'image_url', image_url: { url: att.data } });
          } else {
            userContent.push({ type: 'text', text: `\n[Attached File: ${att.name}]\n${att.data}\n` });
          }
        });
      } else {
        userContent = text;
      }

      messages.push({ role: 'user', content: userContent });
      chatInput.value = '';
      chatInput.style.height = 'auto';
      currentAttachments = [];
      renderAttachmentPreviews();
      renderMessages();

      // Create Assistant Container for Streaming
      const assistantDiv = document.createElement('div');
      assistantDiv.className = 'flex justify-start';
      assistantDiv.innerHTML = `
        <div class="max-w-[85%] md:max-w-[75%] rounded-2xl p-4 bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 rounded-bl-none border border-gray-200 dark:border-gray-700">
          <div class="text-xs font-semibold mb-1 opacity-75">CUBEXA</div>
          <div id="activeStream" class="prose dark:prose-invert text-sm max-w-none break-words streaming-cursor"></div>
        </div>
      `;
      messagesContainer.appendChild(assistantDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      const activeStream = document.getElementById('activeStream');
      let fullResponse = '';

      try {
        const payloadMessages = [
          { role: 'system', content: config.systemPrompt || DEFAULT_CONFIG.systemPrompt },
          ...messages
        ];

        const response = await fetch(`${config.apiEndpoint.replace(/\/+$/, '')}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${config.apiKey}`
          },
          body: JSON.stringify({
            model: config.model || 'gpt-4o',
            messages: payloadMessages,
            stream: true
          })
        });

        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n').filter(line => line.trim().startsWith('data: '));

          for (const line of lines) {
            const dataStr = line.replace(/^data: /, '').trim();
            if (dataStr === '[DONE]') break;

            try {
              const parsed = JSON.parse(dataStr);
              const content = parsed.choices[0]?.delta?.content || '';
              fullResponse += content;
              activeStream.innerHTML = DOMPurify.sanitize(marked.parse(fullResponse));
              messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (err) {}
          }
        }

        activeStream.classList.remove('streaming-cursor');
        activeStream.removeAttribute('id');
        messages.push({ role: 'assistant', content: fullResponse });
        localStorage.setItem('cubexa_messages', JSON.stringify(messages));

      } catch (err) {
        activeStream.classList.remove('streaming-cursor');
        activeStream.innerHTML = `<span class="text-red-500 font-semibold">Error: ${err.message}</span>`;
      }
    });

    // Clear Chat
    clearChatBtn.addEventListener('click', () => {
      if (confirm('Clear current conversation with CUBEXA?')) {
        messages = [];
        localStorage.removeItem('cubexa_messages');
        renderMessages();
      }
    });

    newChatBtn.addEventListener('click', () => {
      messages = [];
      localStorage.removeItem('cubexa_messages');
      renderMessages();
    });

    // Settings Modal Handlers
    function openSettings() {
      apiEndpointInput.value = config.apiEndpoint;
      apiKeyInput.value = config.apiKey;
      modelInput.value = config.model;
      systemPromptInput.value = config.systemPrompt;
      settingsModal.classList.remove('hidden');
    }

    settingsBtn.addEventListener('click', openSettings);
    closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));

    saveSettingsBtn.addEventListener('click', () => {
      config.apiEndpoint = apiEndpointInput.value.trim() || DEFAULT_CONFIG.apiEndpoint;
      config.apiKey = apiKeyInput.value.trim();
      config.model = modelInput.value.trim() || DEFAULT_CONFIG.model;
      config.systemPrompt = systemPromptInput.value.trim() || DEFAULT_CONFIG.systemPrompt;

      localStorage.setItem('cubexa_config', JSON.stringify(config));
      modelBadge.textContent = config.model;
      settingsModal.classList.add('hidden');
    });

    // Theme Toggle
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Run Initializer
    init();
  </script>
</body>
</html>
