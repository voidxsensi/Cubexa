<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Universal AI Chat</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sidebar: {
              light: '#f0f4f9',
              dark: '#1e1f22'
            },
            main: {
              light: '#ffffff',
              dark: '#131314'
            },
            accent: {
              light: '#0b57d0',
              dark: '#a8c7fa'
            }
          }
        }
      }
    }
  </script>

  <!-- Marked.js & DOMPurify for Markdown parsing safely -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
    
    /* Markdown Prose Styles */
    .prose pre {
      background-color: #1e293b !important;
      color: #e2e8f0 !important;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-top: 0.5em;
      margin-bottom: 0.5em;
    }
    .prose code {
      font-family: monospace;
      background-color: rgba(100,116,139,0.2);
      padding: 0.125rem 0.25rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
    }
    .prose pre code {
      background-color: transparent;
      padding: 0;
    }
    .prose p { margin-bottom: 0.75em; }
    .prose p:last-child { margin-bottom: 0; }
    .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
    .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 0.75em; }
    
    /* Blinking Cursor for Streaming */
    .streaming-cursor::after {
      content: '▋';
      display: inline-block;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
      color: currentColor;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Dialog backdrop */
    dialog::backdrop { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px); }
  </style>
</head>
<body class="bg-main-light dark:bg-main-dark text-gray-800 dark:text-gray-200 min-h-[100dvh] flex font-sans transition-colors duration-200">

  <!-- LOADING FALLBACK -->
  <div id="loading" class="fixed inset-0 flex items-center justify-center bg-white dark:bg-gray-900 z-[9999]">
    <div class="flex flex-col items-center">
      <div class="w-10 h-10 border-4 border-gray-200 border-t-accent-light dark:border-gray-700 dark:border-t-accent-dark rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-600 dark:text-gray-400 font-medium">Loading App...</p>
    </div>
  </div>

  <!-- MAIN APP WRAPPER -->
  <div id="app" class="flex w-full min-h-[100dvh] hidden relative">
    
    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-sidebar-light dark:bg-sidebar-dark flex flex-col border-r border-gray-200 dark:border-gray-800 transition-transform duration-300 transform -translate-x-full md:translate-x-0 h-[100dvh]">
      <div class="p-4 flex items-center justify-between">
        <button id="btn-new-chat" class="flex-1 flex items-center gap-2 bg-white dark:bg-main-dark border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 px-4 py-3 rounded-full text-sm font-medium transition-colors shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          New chat
        </button>
        <button id="btn-close-sidebar" class="md:hidden ml-2 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
        <!-- Chat history items will be injected here -->
      </div>

      <div class="p-4 border-t border-gray-200 dark:border-gray-800 space-y-2">
        <button id="btn-sys-prompt" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 text-sm font-medium transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          System Prompt
        </button>
        <button id="btn-settings" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 text-sm font-medium transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Settings
        </button>
      </div>
    </aside>

    <!-- MOBILE SIDEBAR OVERLAY -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-[100dvh] relative min-w-0">
      
      <!-- HEADER -->
      <header class="flex items-center justify-between p-4 bg-main-light/80 dark:bg-main-dark/80 backdrop-blur-md sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <button id="btn-menu" class="md:hidden p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <h1 class="text-xl font-medium tracking-tight text-gray-800 dark:text-gray-100" id="current-chat-title">Gemini Clone</h1>
        </div>
        <button id="btn-theme-toggle" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle Dark Mode">
          <svg id="icon-sun" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <svg id="icon-moon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
      </header>

      <!-- MESSAGES AREA -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:px-8 pb-32">
        <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center max-w-2xl mx-auto space-y-6">
          <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl shadow-lg flex items-center justify-center">
             <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          </div>
          <h2 class="text-3xl md:text-4xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-600">How can I help you today?</h2>
          <p class="text-gray-500 dark:text-gray-400">Configure your OpenRouter API key in settings to get started.</p>
        </div>
        <div id="chat-messages" class="max-w-3xl mx-auto flex flex-col gap-6 hidden">
          <!-- Messages injected here -->
        </div>
      </div>

      <!-- INPUT AREA -->
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-main-light via-main-light to-transparent dark:from-main-dark dark:via-main-dark p-4 pt-10">
        <div class="max-w-3xl mx-auto relative group">
          <form id="chat-form" class="relative flex items-end shadow-[0_0_15px_rgba(0,0,0,0.05)] dark:shadow-[0_0_15px_rgba(0,0,0,0.2)] rounded-3xl bg-white dark:bg-[#1e1f22] border border-gray-200 dark:border-gray-700 transition-colors focus-within:border-gray-300 dark:focus-within:border-gray-500">
            <textarea id="chat-input" rows="1" class="w-full max-h-48 resize-none bg-transparent border-0 focus:ring-0 px-6 py-4 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 outline-none leading-relaxed" placeholder="Message Universal AI..."></textarea>
            <div class="p-2 h-full flex items-center mb-1">
              <button type="submit" id="btn-send" class="p-2 rounded-full text-white bg-black dark:bg-white dark:text-black hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
              </button>
            </div>
          </form>
          <div class="text-center mt-2 text-xs text-gray-400 dark:text-gray-500">
            AI can make mistakes. Verify important information.
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- SETTINGS MODAL -->
  <dialog id="settings-modal" class="bg-white dark:bg-sidebar-dark rounded-2xl shadow-2xl p-0 w-full max-w-md border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-100">
    <div class="p-6">
      <h3 class="text-xl font-semibold mb-4">Settings</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">OpenRouter API Key</label>
          <input type="password" id="input-api-key" placeholder="sk-or-v1-..." class="w-full px-3 py-2 bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-light dark:focus:ring-accent-dark">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Model Name</label>
          <input type="text" id="input-model" value="deepseek/deepseek-r1:free" class="w-full px-3 py-2 bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-light dark:focus:ring-accent-dark">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button id="btn-close-settings" class="px-4 py-2 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">Cancel</button>
        <button id="btn-save-settings" class="px-4 py-2 text-sm font-medium bg-black dark:bg-white text-white dark:text-black rounded-lg hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors">Save</button>
      </div>
    </div>
  </dialog>

  <!-- SYSTEM PROMPT MODAL -->
  <dialog id="sys-prompt-modal" class="bg-white dark:bg-sidebar-dark rounded-2xl shadow-2xl p-0 w-full max-w-lg border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-100">
    <div class="p-6">
      <h3 class="text-xl font-semibold mb-4">Global System Prompt</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-3">Define how the AI should behave across all conversations.</p>
      <textarea id="input-sys-prompt" rows="5" placeholder="You are a helpful assistant..." class="w-full px-3 py-2 bg-gray-50 dark:bg-[#131314] border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-accent-light dark:focus:ring-accent-dark resize-none"></textarea>
      <div class="mt-6 flex justify-end gap-3">
        <button id="btn-close-sys-prompt" class="px-4 py-2 text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">Cancel</button>
        <button id="btn-save-sys-prompt" class="px-4 py-2 text-sm font-medium bg-black dark:bg-white text-white dark:text-black rounded-lg hover:bg-gray-800 dark:hover:bg-gray-200 transition-colors">Save</button>
      </div>
    </div>
  </dialog>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Elements
      const app = document.getElementById('app');
      const loading = document.getElementById('loading');
      
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      const btnMenu = document.getElementById('btn-menu');
      const btnCloseSidebar = document.getElementById('btn-close-sidebar');
      const btnNewChat = document.getElementById('btn-new-chat');
      const chatListEl = document.getElementById('chat-list');
      
      const btnThemeToggle = document.getElementById('btn-theme-toggle');
      const iconSun = document.getElementById('icon-sun');
      const iconMoon = document.getElementById('icon-moon');
      
      const btnSettings = document.getElementById('btn-settings');
      const settingsModal = document.getElementById('settings-modal');
      const btnCloseSettings = document.getElementById('btn-close-settings');
      const btnSaveSettings = document.getElementById('btn-save-settings');
      const inputApiKey = document.getElementById('input-api-key');
      const inputModel = document.getElementById('input-model');
      
      const btnSysPrompt = document.getElementById('btn-sys-prompt');
      const sysPromptModal = document.getElementById('sys-prompt-modal');
      const btnCloseSysPrompt = document.getElementById('btn-close-sys-prompt');
      const btnSaveSysPrompt = document.getElementById('btn-save-sys-prompt');
      const inputSysPrompt = document.getElementById('input-sys-prompt');
      
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');
      const btnSend = document.getElementById('btn-send');
      const messagesContainer = document.getElementById('messages-container');
      const chatMessages = document.getElementById('chat-messages');
      const welcomeScreen = document.getElementById('welcome-screen');
      const currentChatTitle = document.getElementById('current-chat-title');

      // State
      let state = {
        apiKey: '',
        model: 'deepseek/deepseek-r1:free',
        systemPrompt: '',
        darkMode: false,
        chats: [],
        activeChatId: null
      };

      let isGenerating = false;
      let abortController = null;

      // Initialization
      function init() {
        try {
          const savedState = localStorage.getItem('universalAiState');
          if (savedState) {
            const parsed = JSON.parse(savedState);
            state = { ...state, ...parsed };
          }
        } catch (e) {
          console.error('Failed to load state', e);
        }

        applyTheme();
        
        // Settings prepopulate
        inputApiKey.value = state.apiKey;
        inputModel.value = state.model || 'deepseek/deepseek-r1:free';
        inputSysPrompt.value = state.systemPrompt || '';

        // Marked.js config
        if (typeof marked !== 'undefined') {
          marked.setOptions({ breaks: true, gfm: true });
        }

        renderChatList();
        
        if (state.chats.length > 0) {
          loadChat(state.chats[0].id);
        } else {
          startNewChat();
        }

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
          this.style.height = 'auto';
          this.style.height = (this.scrollHeight) + 'px';
          if (this.value.trim() === '') btnSend.disabled = true;
          else btnSend.disabled = false;
        });

        // Hide loader, show app
        loading.classList.add('hidden');
        app.classList.remove('hidden');
      }

      function saveState() {
        localStorage.setItem('universalAiState', JSON.stringify(state));
      }

      // Utils
      const generateId = () => Math.random().toString(36).substr(2, 9);
      
      const escapeHtml = (unsafe) => {
        return (unsafe || '').toString()
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
      };

      // Theme logic
      function applyTheme() {
        if (state.darkMode) {
          document.documentElement.classList.add('dark');
          iconSun.classList.remove('hidden');
          iconMoon.classList.add('hidden');
        } else {
          document.documentElement.classList.remove('dark');
          iconSun.classList.add('hidden');
          iconMoon.classList.remove('hidden');
        }
      }

      btnThemeToggle.addEventListener('click', () => {
        state.darkMode = !state.darkMode;
        saveState();
        applyTheme();
      });

      // Mobile Sidebar
      function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
      }
      
      function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
      }

      btnMenu.addEventListener('click', openSidebar);
      btnCloseSidebar.addEventListener('click', closeSidebar);
      sidebarOverlay.addEventListener('click', closeSidebar);

      // Settings Modal
      btnSettings.addEventListener('click', () => {
        inputApiKey.value = state.apiKey;
        inputModel.value = state.model;
        settingsModal.showModal();
        if(window.innerWidth < 768) closeSidebar();
      });
      btnCloseSettings.addEventListener('click', () => settingsModal.close());
      btnSaveSettings.addEventListener('click', () => {
        state.apiKey = inputApiKey.value.trim();
        state.model = inputModel.value.trim() || 'deepseek/deepseek-r1:free';
        saveState();
        settingsModal.close();
      });

      // System Prompt Modal
      btnSysPrompt.addEventListener('click', () => {
        inputSysPrompt.value = state.systemPrompt;
        sysPromptModal.showModal();
        if(window.innerWidth < 768) closeSidebar();
      });
      btnCloseSysPrompt.addEventListener('click', () => sysPromptModal.close());
      btnSaveSysPrompt.addEventListener('click', () => {
        state.systemPrompt = inputSysPrompt.value.trim();
        saveState();
        sysPromptModal.close();
      });

      // Chat Management
      function startNewChat() {
        if (isGenerating) return;
        state.activeChatId = null;
        chatMessages.innerHTML = '';
        welcomeScreen.classList.remove('hidden');
        chatMessages.classList.add('hidden');
        currentChatTitle.textContent = 'New Chat';
        chatInput.value = '';
        chatInput.style.height = 'auto';
        renderChatList();
        if(window.innerWidth < 768) closeSidebar();
        chatInput.focus();
      }

      btnNewChat.addEventListener('click', startNewChat);

      function renderChatList() {
        chatListEl.innerHTML = '';
        state.chats.forEach(chat => {
          const isActive = chat.id === state.activeChatId;
          const div = document.createElement('div');
          div.className = `group flex items-center justify-between p-3 rounded-lg cursor-pointer transition-colors ${isActive ? 'bg-gray-200 dark:bg-gray-800' : 'hover:bg-gray-100 dark:hover:bg-gray-800/50'}`;
          
          const titleSpan = document.createElement('span');
          titleSpan.className = 'truncate text-sm font-medium flex-1 mr-2';
          titleSpan.textContent = chat.title || 'New Chat';
          titleSpan.onclick = () => loadChat(chat.id);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'hidden group-hover:flex items-center gap-1';

          // Rename
          const btnRename = document.createElement('button');
          btnRename.innerHTML = `<svg class="w-4 h-4 text-gray-500 hover:text-gray-800 dark:hover:text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`;
          btnRename.onclick = (e) => {
            e.stopPropagation();
            const newTitle = prompt('Rename chat:', chat.title);
            if (newTitle !== null && newTitle.trim() !== '') {
              chat.title = newTitle.trim();
              saveState();
              renderChatList();
              if (isActive) currentChatTitle.textContent = chat.title;
            }
          };

          // Delete
          const btnDelete = document.createElement('button');
          btnDelete.innerHTML = `<svg class="w-4 h-4 text-red-400 hover:text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
          btnDelete.onclick = (e) => {
            e.stopPropagation();
            if (confirm('Delete this chat?')) {
              state.chats = state.chats.filter(c => c.id !== chat.id);
              saveState();
              if (isActive) startNewChat();
              else renderChatList();
            }
          };

          actionsDiv.appendChild(btnRename);
          actionsDiv.appendChild(btnDelete);
          
          div.appendChild(titleSpan);
          div.appendChild(actionsDiv);
          chatListEl.appendChild(div);
        });
      }

      function loadChat(chatId) {
        if (isGenerating) return;
        const chat = state.chats.find(c => c.id === chatId);
        if (!chat) return;

        state.activeChatId = chatId;
        currentChatTitle.textContent = chat.title;
        welcomeScreen.classList.add('hidden');
        chatMessages.classList.remove('hidden');
        
        chatMessages.innerHTML = '';
        chat.messages.forEach(msg => {
          if (msg.role !== 'system') renderMessage(msg.role, msg.content);
        });
        
        renderChatList();
        scrollToBottom();
        if(window.innerWidth < 768) closeSidebar();
      }

      function scrollToBottom() {
        messagesContainer.scrollTo({
          top: messagesContainer.scrollHeight,
          behavior: 'smooth'
        });
      }

      // Chat UI Rendering
      function renderMessage(role, content, msgId = null) {
        const div = document.createElement('div');
        div.className = `flex gap-4 w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
        if (msgId) div.id = msgId;

        const innerDiv = document.createElement('div');
        
        if (role === 'user') {
          innerDiv.className = 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-100 px-5 py-3 rounded-3xl max-w-[85%] text-[15px] leading-relaxed whitespace-pre-wrap';
          innerDiv.textContent = content;
        } else {
          innerDiv.className = 'text-gray-800 dark:text-gray-100 py-2 w-full max-w-[90%] md:max-w-[85%] prose dark:prose-invert text-[15px] leading-relaxed';
          innerDiv.innerHTML = parseMarkdown(content);
        }

        div.appendChild(innerDiv);
        chatMessages.appendChild(div);
        return innerDiv;
      }

      function parseMarkdown(text) {
        if (!text) return '';
        try {
          const rawMarkup = marked.parse(text);
          return DOMPurify.sanitize(rawMarkup);
        } catch (e) {
          return escapeHtml(text);
        }
      }

      // Form Submit / Streaming Logic
      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isGenerating) {
          if (abortController) abortController.abort();
          return;
        }

        const text = chatInput.value.trim();
        if (!text) return;

        if (!state.apiKey) {
          alert('Please set your OpenRouter API Key in Settings first.');
          settingsModal.showModal();
          return;
        }

        // Setup Chat context
        if (!state.activeChatId) {
          const newChat = {
            id: generateId(),
            title: text.substring(0, 30) + (text.length > 30 ? '...' : ''),
            messages: []
          };
          if (state.systemPrompt) {
            newChat.messages.push({ role: 'system', content: state.systemPrompt });
          }
          state.chats.unshift(newChat);
          state.activeChatId = newChat.id;
          currentChatTitle.textContent = newChat.title;
          renderChatList();
        }

        const activeChat = state.chats.find(c => c.id === state.activeChatId);
        
        // Add User Message
        activeChat.messages.push({ role: 'user', content: text });
        saveState();
        
        welcomeScreen.classList.add('hidden');
        chatMessages.classList.remove('hidden');
        
        renderMessage('user', text);
        chatInput.value = '';
        chatInput.style.height = 'auto';
        chatInput.focus();
        scrollToBottom();

        // Prep AI Message container
        const aiMsgId = 'msg-' + generateId();
        const aiContentEl = renderMessage('assistant', '', aiMsgId);
        aiContentEl.classList.add('streaming-cursor');
        
        // Prepare API request
        isGenerating = true;
        btnSend.innerHTML = `<svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"></path></svg>`; // Stop icon
        
        abortController = new AbortController();
        let aiFullText = '';

        try {
          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${state.apiKey}`,
              'HTTP-Referer': window.location.href,
              'X-Title': 'Universal AI Chat'
            },
            body: JSON.stringify({
              model: state.model,
              messages: activeChat.messages.map(m => ({ role: m.role, content: m.content })),
              stream: true
            }),
            signal: abortController.signal
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || 'Network response was not ok');
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop(); // keep last incomplete line

            for (const line of lines) {
              const trimmedLine = line.trim();
              if (trimmedLine.startsWith('data: ')) {
                const dataStr = trimmedLine.slice(6);
                if (dataStr === '[DONE]') break;
                
                try {
                  const data = JSON.parse(dataStr);
                  const content = data.choices[0]?.delta?.content;
                  if (content) {
                    aiFullText += content;
                    aiContentEl.innerHTML = parseMarkdown(aiFullText);
                    scrollToBottom();
                  }
                } catch (e) {
                  // Ignore parse errors on partial chunks
                }
              }
            }
          }
          
        } catch (error) {
          if (error.name !== 'AbortError') {
            console.error('API Error:', error);
            aiFullText += `\n\n**Error:** ${error.message}`;
            aiContentEl.innerHTML = parseMarkdown(aiFullText);
          }
        } finally {
          aiContentEl.classList.remove('streaming-cursor');
          isGenerating = false;
          btnSend.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>`;
          
          if (aiFullText.trim() !== '') {
            activeChat.messages.push({ role: 'assistant', content: aiFullText });
            saveState();
          }
        }
      });

      // Handle Enter to Submit (Shift+Enter for new line)
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if(!btnSend.disabled && !isGenerating) {
            chatForm.dispatchEvent(new Event('submit'));
          }
        }
      });

      // Boot
      init();
    });
  </script>
</body>
  </html>
